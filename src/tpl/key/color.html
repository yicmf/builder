
    <style>

        #test-colorpicker-{$field.jquery_id} span
                                             {
                                                 height: 26px;
                                                 line-height: 26px;
                                             }
    </style>
    <div class="layui-input-inline">

        <input type="hidden" name="{$field.field}" value="{$field.value}" lay-verify="{$field.verify}"
               id="yicmf_builder_color_{$field.jquery_id}">
        <div id="test-colorpicker-{$field.jquery_id}"></div>
        <script>
            layui.use(['admin', 'colorpicker'], function () {
                var $ = layui.$
                    , colorpicker = layui.colorpicker;
                //开启全功能
                colorpicker.render({
                    elem: '#test-colorpicker-{$field.jquery_id}'
                    , color: '{$field.value}'
                    //  ,format: 'rgb'
                    , predefine: true
                    , alpha: true
                    , done: function (color) {
                        $('#yicmf_builder_color_{$field.jquery_id}').val(color); //向隐藏域赋值
                        //   layer.tips('给指定隐藏域设置了颜色值：'+ color, this.elem);

                        color || this.change(color); //清空时执行 change
                    }
                    , change: function (color) {
                        //给当前页面头部和左侧设置主题色
                        //  $('.layui-side-menu,.layui-logo').css('cssText', 'background-color: '+ color + ' !important;');
                    }
                });
            });
        </script>
    </div>
