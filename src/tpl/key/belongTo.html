    {php}
    // unset($field['data']);
    //dump($field);exit();
    {/php}
    <div class="layui-input-block">
        <input type="hidden" name="{$field['field']}" value="{$field['value']}" id="find_dialog_id_{$field['jquery_id']}">
        <input type="text" class="layui-input" value="{$field.options.show_field_value}" size="{$field['size']}"  lay-verify="{$field['verify']|raw}" id="find_dialog_{$field['jquery_id']}" readonly>
        <div class="layui-form-mid layui-word-aux"  style="display: none" >清空选择</div>
        {notempty name='field.tips'}
        <div class="layui-form-mid layui-word-aux">{$field.tips|raw|html_entity_decode}</div>
        {/notempty}
    </div>


    <script type="text/javascript">

        layui.use(["laytpl",'admin','forum','table','soulTable',"element"], function(){
            var $ = layui.$
                ,admin = layui.admin
                ,view = layui.view
                ,form = layui.form
                ,element = layui.element
                ,soulTable = layui.soulTable
                ,table = layui.table;
            //默认滑块

            $("#find_dialog_{$field['jquery_id']}").click(function(obj){
                var data = obj.data;
                console.log(data);
                admin.popup({
                    title: '{$field.title}'
                    ,area: ['900px', '600px']
                    ,id: 'LAY-popup-forum-edit'
                    ,resize: false
                    ,success: function(layero, index){
                        view(this.id).render('{$field.optio}__selected_type=radio&selected_id='+$("#find_dialog_id_{$field['jquery_id']}").val(), data).done(function(){
                            form.render(null, 'layuiadmin-app-forum-reply');

                            //监听提交
                            form.on('submit(layuiadmin-app-forumreply-submit)', function(data){
                                var field = data.field; //获取提交的字段
                                var value = JSON.parse(field.data);
                                console.log(value)
                                $("#find_dialog_{$field['jquery_id']}").val(value["{$field.options.show_field}"])
                                $("#find_dialog_id_{$field['jquery_id']}").val(value['id'])
                                //提交 Ajax 成功后，关闭当前弹层并重载表格
                                //$.ajax({});
                                // layui.table.reload('LAY-app-forumreply-list'); //重载表格
                                layer.close(index); //执行关闭
                            });
                        });
                    }
                });
            });

        });


    </script>
