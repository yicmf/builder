

<div class="layui-input-block">
    {php}
    $attachments = $field['value'];

    {/php}
    <div class="row">
        <div class="col-md-3">
            <button type="button" class="layui-btn" id="button-upload-normal-file-{$field.field}"><i class="layui-icon layui-icon-upload"></i>上传文件</button>
        </div>
        <div class="col-md-9" id="show-upload-normal-file-{$field.field}">

            <input type="hidden" name="{$field.field}" id="file_value_{$field.field}" value=""/>
            <div class="layui-upload-list" style="max-width: 1000px;">
                <table class="layui-table">
                    <colgroup>
                        <col>
                        <col width="150">
                        <col width="260">
                        <col width="150">
                    </colgroup>
                    <thead>
                    <tr><th>文件名</th>
                        <th>大小</th>
                        <th>上传进度</th>
                        <th>操作</th>
                    </tr></thead>
                    <tbody id="AttachmentList{$field.field}">

                    {volist name='attachments' id='vo'}
                    <tr id="upload-1645237012012-1" data-id="{$vo.id}">
                        <td>{$vo.name}</td>
                        <td>{$vo.size}</td>
                        <td>
                            <div class="layui-progress" lay-filter="progress-demo-1645237012012-1">
                                <div class="layui-progress-bar" lay-percent="100%" style="width: 100%;"></div></div>
                        </td>
                        <td>
                            <button type="button" class="layui-btn layui-btn-xs layui-btn-danger attachment-d" >删除</button>
                        </td>
                    </tr>
                    {/volist}
                    </tbody>
                </table>
            </div>


            <div class="mask"></div>
            <div class="loading">
                <div class="layui-progress layui-progress-big" lay-showpercent="true" lay-filter="uploadProgress">
                    <div class="layui-progress-bar layui-bg-red" lay-percent="0%"></div>
                </div>
            </div>
            <style type="text/css">
                .mask{position:fixed;width:100%;height:100%;top:0;left:0;background:#000;opacity:0.8;filter:alpha(Opacity=80);-moz-opacity:0.8;z-index:999;display:none;}
                .loading{position:fixed;width:300px;left:50%;margin-left:-150px;top:200px;height:18px;border-radius:10px;background:#fff;z-index:9999;overflow:hidden;display:none;}
            </style>
        </div>
        <script type="text/javascript">
            layui.use(['admin', 'upload',"element"], function () {
                var $ = layui.jquery
                    ,element = layui.element
                    , upload = layui.upload;

                var totalPage = 0;
                var page = 1;
                var status = 0;
                var save_path = '';
                window.getUploadAttachmentValue = function (field) {
                    // console.log(field)
                    var temp = new Array();
                    var items = $('#AttachmentList'+field).children('tr').each(function(index){
                        $(this).data('id') &&temp.push($(this).data('id'))
                    });
                    $("#file_value_"+field).val(temp.join(','));
                    //  console.log(field)
                    console.log(temp.join(','))
                }
                $('#AttachmentList{$field.field}').children('tr').each(function(index){

                    //删除
                    $(this).find('.attachment-d').on('click', function(obj){
                        $(this).parent().parent().remove();
                        getUploadAttachmentValue('{$field.field}');
                    });
                });

                getUploadAttachmentValue('{$field.field}');

                //普通附件上传
                var uploadListIns = upload.render({
                    elem: '#button-upload-normal-file-{$field.field}'
                    ,accept: 'file' //普通文件
                    , url: "{:url('file/Attachment/upload')}"
                    ,elemList: $("#AttachmentList{$field.field}") //列表元素对象
                    ,multiple: true
                    ,number: 3
                    ,auto: true
                    ,choose: function(obj){
                        var that = this;
                        var files = this.files = obj.pushFile(); //将每次选择的文件追加到文件队列
                        //读取本地文件
                        obj.preview(function(index, file, result){
                            var tr = $(['<tr id="upload-'+ index +'" data-id="0">'
                                ,'<td>'+ file.name +'</td>'
                                ,'<td>'+ (file.size/1014).toFixed(1) +'kb</td>'
                                ,'<td><div class="layui-progress" lay-filter="progress-demo-'+ index +'"><div class="layui-progress-bar" lay-percent=""></div></div></td>'
                                ,'<td>'
                                ,'<button class="layui-btn layui-btn-xs demo-reload layui-hide">重传</button>'
                                ,'<button class="layui-btn layui-btn-xs layui-btn-danger demo-delete">删除</button>'
                                ,'</td>'
                                ,'</tr>'].join(''));

                            //单个重传
                            tr.find('.demo-reload').on('click', function(){
                                obj.upload(index, file);
                            });

                            //删除
                            tr.find('.demo-delete').on('click', function(){
                                delete files[index]; //删除对应的文件
                                tr.remove();
                                uploadListIns.config.elem.next()[0].value = ''; //清空 input file 值，以免删除后出现同名文件不可选
                            });

                            that.elemList.append(tr);
                            element.render('progress'); //渲染新加的进度条组件
                        });
                    }
                    ,done: function(res, index, upload){ //成功的回调
                        var that = this;
                        if(res.code == 0){ //上传成功
                            var tr = that.elemList.find('tr#upload-'+ index)
                                ,tds = tr.children();
                            tds.eq(3).find('.demo-reload').remove(); //清空操作
                            delete this.files[index]; //删除文件队列已经上传成功的文件
                            tr.data('id',res.data.id);
                            getUploadAttachmentValue('{$field.field}');
                        }else{
                            this.error(index, upload);
                        }
                    }
                    ,allDone: function(obj){ //多文件上传完毕后的状态回调
                        console.log(obj)
                        var that = this;
                        var tr = that.elemList;
                        console.log(tr.children('tr'));
                        tr.children('tr').each(function(i,n){
                            var obj = $(n)
                            console.log(obj);
                        });
                    }
                    ,error: function(index, upload){ //错误回调
                        var that = this;
                        var tr = that.elemList.find('tr#upload-'+ index)
                            ,tds = tr.children();
                        tds.eq(3).find('.demo-reload').removeClass('layui-hide'); //显示重传
                    }
                    ,progress: function(n, elem, e, index){ //注意：index 参数为 layui 2.6.6 新增
                        element.progress('progress-demo-'+ index, n + '%'); //执行进度条。n 即为返回的进度百分比
                    }
                });


            });
        </script>

    </div>


</div>
