
    <div class="layui-input-block">
        <textarea name="{$field.field}" class="layui-textarea" cols="{$field['size'][0]}" rows="{$field['size'][1]}"
                  lay-verify="{$field['verify']">{$field.value|htmlspecialchars}</textarea>
        {notempty name='field.tips'}
        <div class="layui-form-mid layui-word-aux">{$field.tips|raw|html_entity_decode}</div>
        {/notempty}
    </div>
