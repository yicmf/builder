<!--
  edit.html：页面模式表单壳（2026-09-06 方案D：与 dialog.html 合并）
  公共表单主体在 _form.html（经 Builder::_fetch 注入的 $form_path 引入，支持 view_path 主题覆盖）；
  差异点：本壳带面包屑导航与 layui-card 页面容器；JS 行为差异（req.reload）由 _form.html 内
  form_mode 条件区分——Edit::fetch 会按渲染上下文赋值 form_mode=page/dialog。
  原完整实现保留于 edit.html.bak（2026-09-06）。
-->

<script type="text/javascript" src="__STATIC__/common/clipboard.min.js"></script>
{notempty name='menu_title' }
<title>{$menu_title}</title>

<div class="layui-card layadmin-header">
	<div class="layui-breadcrumb" lay-filter="breadcrumb">
		<a lay-href="">{$p_menu_title|default=''}</a>
		{present name='menu_group_title' }
		<a><cite>{$menu_group_title}</cite></a>
		{/present}
		<a><cite>{$menu_title}</cite></a>
	</div>
</div>
{/notempty}

<div class="layui-fluid">
	<div class="layui-row layui-col-space15">
		<div class="layui-col-md12">
			<div class="layui-card">
				{notempty name='menu_title' }	<div class="layui-card-header">{$menu_title}</div>{/notempty}
				<div class="layui-card-body" pad15>

				<!-- 公共表单主体（与 dialog.html 共享） -->
				{include file="$form_path"/}

				</div>
			</div>
		</div>
	</div>
</div>
